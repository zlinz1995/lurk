<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slingshot Siege</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="game-header">
        <div>
          <div class="game-title">Slingshot Siege</div>
          <div class="game-subtitle">Original block-busting challenge</div>
        </div>
        <div class="game-hints">
          <span>Drag and release the stone</span>
          <span>Clear all targets as fast as you can</span>
        </div>
      </header>

      <div class="game-canvas-wrap">
        <canvas id="siege-canvas" aria-label="Slingshot Siege canvas"></canvas>
        <div class="game-overlay" id="game-overlay" aria-live="polite">
          <div class="game-overlay-title" id="overlay-title">Ready?</div>
          <div class="game-overlay-text" id="overlay-text">
            Pull back the stone and release to launch.
          </div>
          <button class="game-btn" id="overlay-start">Start</button>
        </div>
      </div>

      <footer class="game-footer">
        <div class="game-stats">
          <span id="score-display">Score: 0</span>
          <span id="shots-display">Shots: 0</span>
        </div>
        <div class="game-controls">
          <button class="game-btn" id="start-btn">Start</button>
          <button class="game-btn ghost" id="pause-btn">Pause</button>
          <button class="game-btn ghost" id="reset-btn">Reset</button>
        </div>
        <div class="game-status" id="status-text">Awaiting first launch.</div>
      </footer>
    </div>

    <script src="/playables/sdk.js"></script>
    <script src="game.js"></script>
  </body>
</html>
