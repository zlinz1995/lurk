services:
  - type: web
    name: lurk
    env: node
    plan: free
    buildCommand: npm ci && cd lurk-backend && npm ci && cd .. && npm run build
    startCommand: node lurk-backend/src/server.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_EMAILS
        value: 8yuy8u@gmail.com
      - key: ADMIN_DISPLAY_NAMES
        value: critical centrist
      - key: DEVELOPER_EMAILS
        value: 8yuy8u@gmail.com
      - key: AUTH_ALLOWED_REDIRECT_ORIGINS
        value: https://lurk-app.com,https://api.lurk-app.com
      - key: GOOGLE_REDIRECT_URI
        value: https://api.lurk-app.com/auth/google/callback
      - key: REPORT_DESTINATION_EMAIL
        value: zacharylizn1013@gmail.com
      - key: REPORT_EMAIL_FROM
        value: Lurk <zacharylizn1013@gmail.com>
      - key: RESEND_API_KEY
        sync: false
